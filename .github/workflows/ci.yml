name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff==0.16.5"  # pinned: rule sets change between minors
      - name: Lint (ruff, config in ruff.toml)
        run: ruff check .

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      MINDER_NO_SYSTEMD: "1"
      MINDER_TEST_TIMEOUT: "120"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements-web.txt
      - name: Run tests
        run: python -m pytest -q

  laya-optional:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      MINDER_NO_SYSTEMD: "1"
      USE_TF: "0"
      MINDER_LAYA_DEVICE: "cpu"
      MINDER_TEST_TIMEOUT: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU torch + laya
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest laya -r requirements-web.txt
      - name: Replay routing-core-v1 through the real model
        run: python -m pytest tests/test_routing_replay.py tests/test_classifier_laya.py -m laya -q
