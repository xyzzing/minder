name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: python -m pip install pytest
      - name: Run test suite
        # MINDER_NO_SYSTEMD: install/uninstall paths are per-user systemd —
        # never touch CI's units. MINDER_TEST_TIMEOUT: generous for shared runners.
        run: MINDER_NO_SYSTEMD=1 MINDER_TEST_TIMEOUT=120 python -m pytest tests/ -q
      - name: Secret scan (defense in depth)
        run: |
          ! grep -rnE '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16})' \
            --include='*.py' --include='*.sh' --include='*.json' \
            --include='*.yaml' --include='*.md' . | grep -v -E 'sk-\.\.\.|sk-proj-\.\.\.'
