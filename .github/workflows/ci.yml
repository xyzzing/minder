name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff==0.16.5"  # pinned: rule sets change between minors
      - name: Lint (ruff, config in ruff.toml)
        run: ruff check .

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mypy
        run: pip install "mypy==2.3.1"  # pinned: new checks land between minors
      - name: Types (minder_core/memory/decision/trace/op/web)
        run: mypy minder_core minder_memory minder_decision minder_trace minder_op minder_web --ignore-missing-imports

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      MINDER_NO_SYSTEMD: "1"
      MINDER_TEST_TIMEOUT: "120"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the instruction gate verifies cited commit hashes
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements-web.txt
      - name: Run tests
        run: python -m pytest -q

  laya-optional:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      MINDER_NO_SYSTEMD: "1"
      USE_TF: "0"
      MINDER_LAYA_DEVICE: "cpu"
      MINDER_TEST_TIMEOUT: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU torch + laya
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest laya -r requirements-web.txt
      - name: Replay routing-core-v1 through the real model
        run: python -m pytest tests/test_routing_replay.py tests/test_classifier_laya.py -m laya -q

  proven-red:
    # P2: each PR's changed unit tests must FAIL on the pre-change code.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest -r requirements-web.txt
      - run: scripts/proven-red.sh "origin/${{ github.base_ref }}" HEAD

  pr-acceptance:
    # P1: the PR body quotes the issue's acceptance lines; feat PRs name a spec.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: scripts/pr-body-check.sh

  mutation-smoke:
    # The one check that proves existing tests can fail.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest -r requirements-web.txt
      - run: scripts/mutation-smoke.sh
