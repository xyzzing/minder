[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minder"
dynamic = ["version"]
description = "Local-first governed-agent runtime: deterministic escalation, evidence ledger, and protected-metric evals for local LLM coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zac Chen" }]
keywords = ["llm", "agents", "local-first", "llama-cpp", "guardrails", "evals"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]

# The wheel ships the operator plane, the evidence store, the decision
# gateway and minder_core — importable and drivable without a harness.
# The full governed runtime (hook transports, proxy, sink, installers)
# stays a staged checkout: `install.sh` wires it to a real llama-server
# and your harness. Keep these lists in sync with the repo layout.
[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.27", "jinja2>=3.1"]

[project.scripts]
minder-op = "minder_op.cli:main"
minder-web = "minder_web.__main__:main"

[tool.setuptools]
py-modules = ["minder"]
packages = [
    "minder_core",
    "minder_memory",
    "minder_decision",
    "minder_decision.providers",
    "minder_op",
    "minder_trace",
    "minder_web",
]

[tool.setuptools.dynamic]
version = { attr = "minder.MINDER_VERSION" }

[tool.setuptools.package-data]
minder_memory = ["migrations/*.sql"]
minder_web = ["templates/*.html", "static/*"]
